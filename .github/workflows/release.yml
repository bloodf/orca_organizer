name: Release

# Push a tag matching the plugin version (e.g. v0.7.0) to create a GitHub
# release and publish it to Orca Cloud.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Arrangement tests
        run: uv run --python 3.12 --with numpy --with pillow python tests/test_shape_arrange.py
      - name: Plugin tests
        run: uv run --python 3.12 --with numpy --with pillow python tests/test_plugin.py

      - name: Check tag matches plugin version
        run: |
          version=$(sed -n 's/^# version = "\(.*\)"$/\1/p' shape_arrange.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin version $version in shape_arrange.py"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 ~ "^## " {p = index($0, v) == 1; next} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## ${GITHUB_REF_NAME#v}' section"
            exit 1
          fi

      # Orca Cloud requires an OS/arch suffix in the file name; "any" = pure Python.
      - name: Build Orca Cloud file
        run: mkdir -p dist && cp shape_arrange.py dist/shape_arrange_any.py

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/shape_arrange_any.py assets/icon.png \
            --title "Shape-Aware Arrange $GITHUB_REF_NAME" --notes-file notes.md

  orca-cloud:
    needs: release
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish-orcacloud.yml
    with:
      tag: ${{ github.ref_name }}
